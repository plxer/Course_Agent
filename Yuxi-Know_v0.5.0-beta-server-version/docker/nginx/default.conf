server {
    listen 80 default_server;
    server_name _;

    # 增加客户端请求体大小限制
    client_max_body_size 20M;

    # Docker 内嵌 DNS；用变量 + resolver 让 upstream 在请求时再解析，避免 nginx 启动早于 api 时出现
    # host not found in upstream "api"
    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # 须用 $request_uri 整段转发：variables 的 proxy_pass 若写 http://$h/api/ 会错误拼路径，导致上游变成 GET /api/ 而 404
    location /api/ {
        set $api_upstream http://api:5050;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关闭缓冲：对话流才能边生成边到浏览器；课本图/视频也不会被攒成整包再发
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }
}